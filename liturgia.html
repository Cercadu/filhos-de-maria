<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Liturgia Diária - AFIM</title>
<meta name="theme-color" content="#0f2645" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/favicon.ico" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="brand">
      <img src="/assets/img/logo-badge.png" alt="AFIM" />
      <span class="brand-text">
        <strong>AFIM</strong>
        <span>Filhos de Maria</span>
      </span>
    </a>
    <nav class="header-nav">
      <a href="/" data-nav="/">Início</a>
      <a href="/liturgia.html" data-nav="/liturgia.html">Liturgia</a>
      <a href="/oracao.html" data-nav="/oracao.html">Orações</a>
    </nav>
  </div>
</header>

<main class="container section">
  <div class="section-title">
    <span class="bar"></span>
    <h2>Liturgia Diária</h2>
  </div>

  <div class="date-nav">
    <button class="icon-btn" id="prev-day" aria-label="Dia anterior">‹</button>
    <button class="date-label" id="date-label-btn" type="button" aria-label="Escolher outra data">
      <strong id="date-weekday">carregando...</strong>
      <span id="date-full"></span>
    </button>
    <button class="icon-btn" id="today-btn" aria-label="Ir para hoje" title="Hoje">📅</button>
    <button class="icon-btn" id="next-day" aria-label="Próximo dia">›</button>
    <input type="date" id="date-picker" aria-label="Selecionar data" />
  </div>

  <div id="liturgy-content">
    <div class="spinner"></div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="/" data-nav="/"><span class="icon">🏠</span>Início</a>
  <a href="/liturgia.html" data-nav="/liturgia.html"><span class="icon">📖</span>Liturgia</a>
  <a href="/oracao.html" data-nav="/oracao.html"><span class="icon">🙏</span>Orações</a>
</nav>

<footer class="site-footer">
  <div class="container">
    <img src="/assets/img/logo-badge.png" alt="AFIM" />
    <p>Associação Filhos de Maria (AFIM)</p>
    <p class="social"><a href="https://www.instagram.com/filhosdemariacn/" target="_blank" rel="noopener">📷 Siga no Instagram</a></p>
    <p class="fine">© <span id="year"></span> AFIM · <a href="/admin/">Área administrativa</a></p>
  </div>
</footer>

<script src="/js/app.js"></script>
<script src="/js/liturgia.js"></script>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
